# Пример виртуального хоста для публичного сайта (mamonov-nuxt → node .output/server или PM2).
# HTTPS добавьте через certbot (например: certbot --nginx -d ваш.домен).
#
# Перед подключением:
# 1) В http { } один раз (часто /etc/nginx/nginx.conf) добавьте:
#    map $http_upgrade $connection_upgrade {
#        default upgrade;
#        ''      close;
#    }
# 2) Замените: имя апстрима, порт процесса Nuxt, server_name, пути к логам.
# 3) Сохраните как, например, /etc/nginx/sites-available/mamonov-nuxt и сделайте symlink в sites-enabled.
#
# Порт по умолчанию для `node .output/server/index.mjs` — задайте через PORT=3020 или в ecosystem PM2.

upstream mamonov_nuxt {
    server 127.0.0.1:3020;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name ivanmamonov.example.com;

    client_max_body_size 10m;

    # ── Security headers ─────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml image/svg+xml;

    # ── Static assets from Nuxt build (long-lived cache) ─────
    location /_nuxt/ {
        proxy_pass http://mamonov_nuxt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ── All other requests → Nuxt ────────────────────────────
    location / {
        proxy_pass http://mamonov_nuxt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Deny dotfiles ────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/ivanmamonov.example.com.access.log;
    error_log  /var/log/nginx/ivanmamonov.example.com.error.log;
}
